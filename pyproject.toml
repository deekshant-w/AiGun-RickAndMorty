[project]
name = "aigun-rickandmorty"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.1",
    "openwakeword>=0.6.0",
    "sounddevice>=0.5.5",
    "webrtcvad-wheels>=2.0.14",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "poethepoet>=0.48",
    "pre-commit>=4.0",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # line length is the formatter's job
