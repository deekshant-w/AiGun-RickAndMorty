[project]
name = "aigun-rickandmorty"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "clip",
    "datasets>=5.0.1",
    "faster-whisper>=1.2.1",
    "ftfy>=6.3.1",
    "huggingface-hub>=1.27.0",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "openai-clip>=1.0.1",
    "opencv-python>=5.0.0.93",
    "openwakeword>=0.6.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "regex>=2026.7.19",
    "safetensors>=0.8.0",
    "scipy>=1.18.0",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.5",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
    "webrtcvad-wheels>=2.0.14",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
clip = { git = "https://github.com/openai/CLIP.git" }

[dependency-groups]
dev = [
    "mypy>=2.3",
    "poethepoet>=0.48",
    "pre-commit>=4.0",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # line length is the formatter's job
